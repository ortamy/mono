name: Deploy to GitHub Pages (ОТКЛЮЧЕНО)

# ⚠️ Этот воркфлоу больше не может деплоить сайт.
#
# Причина: из next.config.mjs убран output: 'export', потому что app/api/lead
# держит серверные секреты (токен Telegram бота, ключ Supabase) и требует
# server-рантайма. GitHub Pages отдаёт только статические файлы и не умеет
# исполнять Node — сборка больше не попадает в ./out, и upload-pages-artifact
# завершался бы ошибкой.
#
# Что сделать вместо этого:
#   1. Задеплоить на хостинг с server-рантаймом (Vercel / Render / Railway /
#      Fly.io) — тогда app/api/lead заработает, а токен бота перестанет быть
#      виден в бандле.
#   2. Задать там переменные окружения из .env.example.
#   3. Выполнить SQL из supabase/landing_leads.sql в Supabase.
#
# Если нужно вернуться к статике — удалите app/api/lead, верните
# output: 'export' в next.config.mjs и восстановите этот файл из истории.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Explain why deployment stopped
        run: |
          echo "::error::Деплой на GitHub Pages отключён: сайт переведён в server-режим ради /api/lead."
          echo "Подробности — в начале .github/workflows/deploy.yml"
          exit 1