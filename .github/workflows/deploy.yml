name: Deploy to GitHub Pages

# Деплой статического экспорта (./out) на GitHub Pages.
#
# Важно: сборка идёт через `npm run build:static`, а не через обычный
# `next build`. Только статический вариант включает output: 'export' и
# подставляет NEXT_PUBLIC_OG_IMAGE (см. scripts/build-static.mjs). POST-роуты
# /api/lead и /api/design-lead в статике не выкладываются — Next помечает их как
# Dynamic и пропускает, поэтому сборка не падает.
#
# Из этого следует главное ограничение Pages: серверной части там нет. Формы
# показывают запасную ссылку «Написать в Telegram», лиды НЕ уходят в Telegram
# бота и НЕ пишутся в Supabase. Переменные из .env.example нужны только для
# хостинга с Node-рантаймом (Vercel / Render / Railway) — там собирается обычный
# `npm run build`, и приём лидов снова работает.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз: если в main улетают несколько пушей — отменяем предыдущий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Отдаёт base_path (/имя-репозитория), base_url и origin (https://user.github.io).
      # base_path нужен, потому что сайт живёт в под-каталоге /mono, а base_url —
      # чтобы карта сайта и canonical-ссылки указывали на реальный host, а не на
      # значения по умолчанию из lib/site.ts.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build:static

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
